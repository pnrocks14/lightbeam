name: Build all platforms

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  web-linux-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter build web --release --no-web-resources-cdn
      - run: flutter build linux --release
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: lightbeam-web, path: build/web }
      - uses: actions/upload-artifact@v4
        with: { name: lightbeam-linux, path: build/linux/x64/release/bundle }
      - uses: actions/upload-artifact@v4
        with: { name: lightbeam-android, path: build/app/outputs/flutter-apk/app-release.apk }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with: { name: lightbeam-windows, path: build/windows/x64/runner/Release }

  apple:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter build macos --release
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with: { name: lightbeam-macos, path: build/macos/Build/Products/Release/LightBeam.app }
      - uses: actions/upload-artifact@v4
        with: { name: lightbeam-ios-unsigned, path: build/ios/iphoneos/Runner.app }
